<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Homepage landscape with flying butterfly">
  <title>Homepage background</title>

  <style>
    /* 底图 */
    .scene { pointer-events: none; }

    /* 飞舞路线：默认隐藏。调试时把 stroke 改成 #2a2a2a */
    #butterfly-flight {
      fill: none;
      stroke: none;
      stroke-width: 1.25;
      stroke-dasharray: 6 6;
    }

    /* 蝴蝶本体（与原插画同样的细线平涂） */
    .bf-wing { fill: #F6E89A; stroke: #2a2a2a; stroke-width: 1.35; stroke-linejoin: round; stroke-linecap: round; }
    .bf-body { fill: #3F382E; stroke: #2a2a2a; stroke-width: 1.1; }
    .bf-line { fill: none; stroke: #2a2a2a; stroke-width: 1.15; stroke-linecap: round; }

    @media (prefers-reduced-motion: reduce) {
      #butterfly animate, #butterfly animateMotion, #butterfly animateTransform { display: none; }
    }
  </style>

  <defs>
    <!-- 可复用的蝴蝶图形，局部坐标原点在身体中心，朝向 +x 以便沿路径自动转向 -->
    <g id="butterfly-drawing">
      <g id="wing-left">
        <path class="bf-wing" d="M-1.2 -1.5 C-9 -13,-22 -11,-24 -1.5 C-22 6,-11 5.5,-1 2.2 Z"/>
        <path class="bf-wing" d="M-1 2 C-8 5,-14 11,-9 15.5 C-3.5 16.5,-1.5 8.5,-0.6 4 Z"/>
        <animateTransform attributeName="transform" type="rotate" values="0;-26;0;18;0" dur="0.38s" repeatCount="indefinite" additive="sum"/>
      </g>
      <g id="wing-right">
        <path class="bf-wing" d="M1.2 -1.5 C9 -13,22 -11,24 -1.5 C22 6,11 5.5,1 2.2 Z"/>
        <path class="bf-wing" d="M1 2 C8 5,14 11,9 15.5 C3.5 16.5,1.5 8.5,0.6 4 Z"/>
        <animateTransform attributeName="transform" type="rotate" values="0;26;0;-18;0" dur="0.38s" repeatCount="indefinite" additive="sum"/>
      </g>
      <ellipse class="bf-body" cx="0" cy="1.2" rx="2.05" ry="7.1"/>
      <circle class="bf-body" cx="0" cy="-5.6" r="2.15"/>
      <path class="bf-line" d="M-0.6 -7.2 C-4 -14,-7.5 -15.5,-9 -14.2"/>
      <path class="bf-line" d="M0.6 -7.2 C4 -14,7.5 -15.5,9 -14.2"/>
    </g>
  </defs>

  <!-- 场景底图：博物馆已放大，道路接到门口，树后不再藏翅膀 -->
  <image class="scene" href="homepage-bg-museum-v2.png" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!--
    飞舞路径（闭合环）：从右侧第二棵树附近出发，
    掠过天空空档，绕博物馆屋顶一圈，再回到树丛。
    之后改轨迹只需要编辑这条 path。
  -->
  <path id="butterfly-flight" d="
    M 1092 248
    C 1010 168  860 118  670 148
    C 520 172  330 148  248 204
    C 188 248  236 318  360 292
    C 520 258  690 198  860 218
    C 980 232  1068 198  1092 248
  "/>

  <!-- 单独的蝴蝶：沿 #butterfly-flight 飞舞。可整组隐藏/替换 -->
  <g id="butterfly" transform="translate(0,0)">
    <use href="#butterfly-drawing" transform="scale(1.15)"/>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
      <mpath href="#butterfly-flight"/>
    </animateMotion>
  </g>
</svg>
